name: Verify pinned VH phone (no rebuild)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in phone remains self-contained
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('phone')
          page = (root/'index.html').read_text(encoding='utf-8')
          assert (root/'js/vh-investigator-apps.js').is_file()
          assert (root/'assets/investigator-avatar.png').is_file()
          for href in re.findall(r'<link[^>]*href="([^"]+)"', page):
              name = href.split('?', 1)[0]
              if name.startswith('css/'):
                  assert (root/name).is_file(), name
          for src in re.findall(r'<script[^>]*src="([^"]+)"', page):
              name = src.split('?', 1)[0]
              if name.startswith('js/'):
                  assert (root/name).is_file(), name
          print('Verified pinned phone assets; no files regenerated.')
          PY
