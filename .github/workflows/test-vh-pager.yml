name: Test VH phone navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vh-phone.css'
      - 'js/vh-phone.js'
      - 'phone/index.html'
      - 'phone/css/vh-investigator-home.css'
      - 'phone-overrides/vh-investigator-home.css'
      - '.github/workflows/test-vh-pager.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify no swipe hijacking and tiny chevrons
        run: |
          node --check js/vh-phone.js
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('js/vh-phone.js','utf8');
          const css=fs.readFileSync('vh-phone.css','utf8');
          assert(html.includes('id="vhOpenPhone"')&&html.includes('id="vhPhoneBack"'));
          assert(!html.includes('vhPhoneSwipeEdge'));
          assert(!/pointerdown|pointermove|touchstart|touchmove|touch-action:none/i.test(js));
          assert(css.includes('width:34px')&&css.includes('.vh-nav-next'));
          console.log('PASS: small top-corner chevrons; swipe listeners removed');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vh.log 2>&1 &
      - name: Verify click navigation and preserved phone state
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
                const context=await browser.newContext({viewport,isMobile:viewport.width<500,hasTouch:viewport.width<500});
                const p=await context.newPage();
                const errors=[];
                p.on('pageerror',e=>errors.push(e.message));
                await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
                await p.locator('#vhOpenPhone').click();
                await p.waitForFunction(()=>document.body.classList.contains('vh-phone-active'),null,{timeout:4000});
                const frame=p.frameLocator('#vhPhoneIframe');
                await frame.locator('#homeScreen.active').waitFor({timeout:12000});
                assert.equal(await frame.locator('#lockScreen.active,#passcodeScreen.active').count(),0,'No lock or PIN screen');
                assert.equal(await frame.locator('.battery-percent').textContent(),'98%');
                // Cauã's iOS status-chrome script may replace the fill DOM node.
                // The visible percentage remains the stable public UI contract.
                const appPositions=await frame.locator('#iconGrid > .app').evaluateAll(nodes=>nodes.map(el=>{
                  const r=el.getBoundingClientRect();
                  return {app:el.dataset.app,x:r.x,y:r.y,w:r.width};
                }));
                assert.deepEqual(appPositions.map(a=>a.app),['notes','messages','safari']);
                assert.ok(appPositions.every(a=>Math.abs(a.y-appPositions[0].y)<2),'Three apps must share top row: '+JSON.stringify(appPositions));
                assert.ok(appPositions[0].x<appPositions[1].x&&appPositions[1].x<appPositions[2].x,'Apps must sit side by side');
                assert.equal(await frame.locator('#homeScreen .dock,#homeScreen .page-dots').count(),0);
                const topNext=await p.locator('#vhOpenPhone').evaluate(el=>el.getBoundingClientRect().top);
                const topBack=await p.locator('#vhPhoneBack').evaluate(el=>el.getBoundingClientRect().top);
                assert.ok(Math.abs(topNext-topBack)<2,'Both chevrons must align vertically: '+topNext+' '+topBack);
                const src=await p.locator('#vhPhoneIframe').getAttribute('src');
                await p.locator('#vhPhoneBack').click();
                await p.waitForFunction(()=>!document.body.classList.contains('vh-phone-active')&&!document.body.classList.contains('vh-phone-transitioning'),null,{timeout:4000});
                await p.locator('#vhOpenPhone').click();
                await p.waitForFunction(()=>document.body.classList.contains('vh-phone-active'),null,{timeout:4000});
                assert.equal(await p.locator('#vhPhoneIframe').getAttribute('src'),src);
                assert.equal(await p.locator('#vhPhoneBack').count(),1);
                assert.deepEqual(errors,[]);
                console.log('PASS',viewport.width,'px: open, close, reopen, iframe preserved');
                await context.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
