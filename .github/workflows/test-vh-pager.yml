name: Test swipe-only pager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/vh-phone.js'
      - 'vh-phone.css'
      - 'index.html'
      - '.github/workflows/test-vh-pager.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and no visible arrow
        run: |
          node --check js/vh-phone.js
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const h=fs.readFileSync('index.html','utf8');
          assert(!h.includes('id="vhOpenPhone"'));
          assert(!h.includes('id="vhPhoneBack"'));
          assert(h.includes('id="vhPhoneSwipeEdge"'));
          console.log('PASS: both arrows removed, invisible swipe edge present');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vh.log 2>&1 &
      - name: Test real finger drag both ways
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const p=await context.newPage();
              const errors=[];
              p.on('pageerror',e=>errors.push(e.message));
              await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>document.querySelector('#vhPhoneIframe').getAttribute('src')==='phone/',null,{timeout:15000});
              assert.equal(await p.locator('#vhOpenPhone,#vhPhoneBack').count(),0);
              const cdp=await context.newCDPSession(p);
              async function swipe(startX,endX,y){
                await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:startX,y}]});
                for(let i=1;i<=8;i++){
                  const x=startX+(endX-startX)*i/8;
                  await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y}]});
                  await p.waitForTimeout(16);
                }
                await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
              }
              await swipe(330,105,690);
              await p.waitForFunction(()=>document.body.classList.contains('vh-phone-active'),null,{timeout:4000});
              assert.ok(Math.abs(await p.locator('#vhPhoneLayer').evaluate(el=>el.getBoundingClientRect().left))<2);
              await p.frameLocator('#vhPhoneIframe').locator('#lockScreen').waitFor({state:'attached',timeout:12000});
              await swipe(8,290,370);
              await p.waitForFunction(()=>!document.body.classList.contains('vh-phone-active')&&!document.body.classList.contains('vh-nav-snapping'),null,{timeout:4000});
              assert.ok((await p.locator('#vhPhoneLayer').evaluate(el=>el.getBoundingClientRect().left))>380);
              assert.deepEqual(errors,[]);
              console.log('PASS: finger-following dossier-to-phone swipe and invisible-edge phone-to-dossier swipe');
              await context.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
