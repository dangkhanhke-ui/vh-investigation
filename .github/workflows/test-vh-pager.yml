name: Test VH phone navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vh-phone.css'
      - 'js/vh-phone.js'
      - '.github/workflows/test-vh-pager.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify no swipe hijacking and tiny chevrons
        run: |
          node --check js/vh-phone.js
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('js/vh-phone.js','utf8');
          const css=fs.readFileSync('vh-phone.css','utf8');
          assert(html.includes('id="vhOpenPhone"')&&html.includes('id="vhPhoneBack"'));
          assert(!html.includes('vhPhoneSwipeEdge'));
          assert(!/pointerdown|pointermove|touchstart|touchmove|touch-action:none/i.test(js));
          assert(css.includes('width:34px')&&css.includes('.vh-nav-next'));
          console.log('PASS: small top-corner chevrons; swipe listeners removed');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vh.log 2>&1 &
      - name: Verify click navigation and preserved phone state
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
                const context=await browser.newContext({viewport,isMobile:viewport.width<500,hasTouch:viewport.width<500});
                const p=await context.newPage();
                const errors=[];
                p.on('pageerror',e=>errors.push(e.message));
                await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
                await p.locator('#vhOpenPhone').click();
                await p.waitForFunction(()=>document.body.classList.contains('vh-phone-active'),null,{timeout:4000});
                const frame=p.frameLocator('#vhPhoneIframe');
                await frame.locator('#lockScreen').waitFor({state:'attached',timeout:12000});
                const src=await p.locator('#vhPhoneIframe').getAttribute('src');
                await p.locator('#vhPhoneBack').click();
                await p.waitForFunction(()=>!document.body.classList.contains('vh-phone-active')&&!document.body.classList.contains('vh-phone-transitioning'),null,{timeout:4000});
                await p.locator('#vhOpenPhone').click();
                await p.waitForFunction(()=>document.body.classList.contains('vh-phone-active'),null,{timeout:4000});
                assert.equal(await p.locator('#vhPhoneIframe').getAttribute('src'),src);
                assert.equal(await p.locator('#vhPhoneBack').count(),1);
                assert.deepEqual(errors,[]);
                console.log('PASS',viewport.width,'px: open, close, reopen, iframe preserved');
                await context.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
