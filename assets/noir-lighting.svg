<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="near"><feGaussianBlur stdDeviation="5.2"/></filter>
<filter id="far"><feGaussianBlur stdDeviation="16.9"/></filter>
<linearGradient id="ambient" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#c3d3da" stop-opacity=".14"/><stop offset=".52" stop-color="#d7e0df" stop-opacity=".08"/><stop offset="1" stop-color="#05080d" stop-opacity=".19"/></linearGradient>
<linearGradient id="lower" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#030508" stop-opacity="0"/><stop offset=".55" stop-color="#030508" stop-opacity=".04"/><stop offset="1" stop-color="#030508" stop-opacity=".66"/></linearGradient>
</defs>
<!-- Cool ambient light, deliberately no radial/elliptical glow -->
<rect width="1440" height="1000" fill="url(#ambient)"/>
<!-- Window frame: long straight-edged angular cast shadows, projected diagonally -->
<g fill="#02050a" opacity=".511" filter="url(#near)">
<polygon points="-180,-80 110,-80 590,1040 335,1040"/>
<polygon points="330,-80 424,-80 904,1040 806,1040"/>
<polygon points="970,-80 1075,-80 1555,1040 1450,1040"/>
</g>
<!-- A transverse window bar casts one long slanted horizontal band -->
<g fill="#03060a" opacity=".406" filter="url(#near)">
<polygon points="-150,255 1540,-65 1540,32 -150,355"/>
</g>
<!-- A second narrow crossbar, shifted to create irregular window geometry -->
<g fill="#03060a" opacity=".294" filter="url(#far)">
<polygon points="-120,760 1570,430 1570,502 -120,838"/>
</g>
<!-- Broad occlusion by an object outside frame, with straight angular silhouette -->
<g fill="#010307" opacity=".406" filter="url(#far)">
<polygon points="-100,-80 130,-80 -100,430"/>
<polygon points="1280,-100 1550,-100 1550,520 1440,415"/>
</g>
<rect width="1440" height="1000" fill="url(#lower)"/>
</svg>