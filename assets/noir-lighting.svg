<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <filter id="feather" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="105"/></filter>
 <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="155"/></filter>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#cbd8df" stop-opacity="0"/>
  <stop offset=".27" stop-color="#d7e1e6" stop-opacity=".10"/>
  <stop offset=".47" stop-color="#e6edf0" stop-opacity=".24"/>
  <stop offset=".66" stop-color="#dce6e9" stop-opacity=".13"/>
  <stop offset="1" stop-color="#cbd8df" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="edgeShade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#010409" stop-opacity=".60"/>
  <stop offset=".23" stop-color="#010409" stop-opacity=".12"/>
  <stop offset=".41" stop-color="#010409" stop-opacity="0"/>
  <stop offset=".65" stop-color="#010409" stop-opacity="0"/>
  <stop offset=".84" stop-color="#010409" stop-opacity=".13"/>
  <stop offset="1" stop-color="#010409" stop-opacity=".57"/>
 </linearGradient>
 <linearGradient id="verticalShade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#010409" stop-opacity=".25"/>
  <stop offset=".25" stop-color="#010409" stop-opacity="0"/>
  <stop offset=".70" stop-color="#010409" stop-opacity=".04"/>
  <stop offset="1" stop-color="#010409" stop-opacity=".37"/>
 </linearGradient>
</defs>
<!-- Broad, slanted window-light spill with heavily feathered edges; no hard shadow bars. -->
<g transform="rotate(-23 720 500)">
 <rect x="320" y="-360" width="810" height="1720" rx="180" fill="url(#beam)" filter="url(#feather)"/>
</g>
<!-- Very soft surrounding ambient falloff; the center stays legible. -->
<rect width="1440" height="1000" fill="url(#edgeShade)"/>
<rect width="1440" height="1000" fill="url(#verticalShade)"/>
</svg>